name: itischat

x-backend-env: &backend-env
  APP_ENV: prod
  APP_SECRET: ${APP_SECRET:-change-me-please}
  DATABASE_URL: postgresql://chat:chat@db:5432/chat?serverVersion=17&charset=utf8
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gemma3:4b}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy

  ws:
    build: ./backend
    command: php bin/console app:chat-server
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./frontend
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      - api
      - ws

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-gemma3:4b}"]
    depends_on:
      - ollama
    restart: "no"

volumes:
  db-data:
  ollama-data:
